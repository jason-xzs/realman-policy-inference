# @package _global_

defaults:
  - override /data: realman_demo_finetune
  - override /model: fastwam
  - _self_

override_instruction: "The left arm lifts the cup, the right arm picks up the sugar, the right arm puts the sugar into the cup, and then the left arm puts the cup down."

data:
  train:
    dataset_dirs: &dataset_dirs
      - /nix/yanhan/deltawam/data/realman_demo_data/realman_teleop_vr_dual_sugar_0813_21
      - /nix/yanhan/deltawam/data/realman_demo_data/realman_teleop_vr_dual_sugar_0814_11
    pretrained_norm_stats: ./data/realman_demo_finetune/sugar/dataset_stats.json
    text_embedding_cache_dir: ./data/text_embeds_cache/realman_demo_sugar
  val:
    dataset_dirs: *dataset_dirs
    pretrained_norm_stats: ./data/realman_demo_finetune/sugar/dataset_stats.json
    text_embedding_cache_dir: ./data/text_embeds_cache/realman_demo_sugar

batch_size: 8
num_workers: 12
model:
  mot_checkpoint_mixed_attn: false
learning_rate: 1.0e-5
lr_scheduler_type: cosine
max_steps: 15000
num_epochs: 1
log_every: 10
save_every: 15000
eval_every: 15000
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: /nix/yanhan/deltawam/runs/realman_rmc_aidal_uncond_3cam_384_1e-4/2026-08-15_15-13-21/checkpoints/weights/step_050000.pt

