# @package _global_

defaults:
  - override /data: robotwin
  - override /model: deltawam_lam
  - _self_

robotwin_subset:
  task_mapping_file: ./configs/data/robotwin2_official_task_mapping.json
  train_task_names:
    - adjust_bottle
    - beat_block_hammer
    - blocks_ranking_size
    - click_alarmclock
    - click_bell

  eval_task_names: ${robotwin_subset.train_task_names}

# dataloading
batch_size: 16
num_workers: 8

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 5000
eval_every: 500

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
